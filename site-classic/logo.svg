<!-- Логотип ООО «ГлобалМеталлХолд». TODO: заменить на фирменный логотип, когда будет готов (сохранить имя logo.svg — подхватится автоматически) -->
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="56" viewBox="0 0 260 56" role="img" aria-label="ГлобалМеталлХолд">
  <defs>
    <linearGradient id="gmhGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="gmhPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2B2B"/>
      <stop offset="1" stop-color="#1E1E1E"/>
    </linearGradient>
  </defs>

  <!-- знак: гексагональная "гайка" с шестерней внутри -->
  <g>
    <path d="M28 4l20.8 12v24L28 52 7.2 40V16z" fill="url(#gmhPlate)" stroke="url(#gmhGold)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="28" cy="28" r="10.5" fill="none" stroke="url(#gmhGold)" stroke-width="2.2"/>
    <!-- зубья шестерни -->
    <g fill="url(#gmhGold)">
      <rect x="26.4" y="13.6" width="3.2" height="4.4" rx="1"/>
      <rect x="26.4" y="38" width="3.2" height="4.4" rx="1"/>
      <rect x="13.6" y="26.4" width="4.4" height="3.2" rx="1"/>
      <rect x="38" y="26.4" width="4.4" height="3.2" rx="1"/>
      <rect x="36.5" y="16.9" width="3.2" height="4.4" rx="1" transform="rotate(45 38.1 19.1)"/>
      <rect x="16.3" y="34.7" width="3.2" height="4.4" rx="1" transform="rotate(45 17.9 36.9)"/>
      <rect x="36.5" y="34.7" width="3.2" height="4.4" rx="1" transform="rotate(-45 38.1 36.9)"/>
      <rect x="16.3" y="16.9" width="3.2" height="4.4" rx="1" transform="rotate(-45 17.9 19.1)"/>
    </g>
    <circle cx="28" cy="28" r="4" fill="url(#gmhGold)"/>
  </g>

  <!-- название (RU) -->
  <text x="58" y="27" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="17.5" font-weight="800" letter-spacing="0.2" fill="#FFFFFF">Глобал<tspan fill="url(#gmhGold)">Металл</tspan>Холд</text>
  <!-- подпись-таглайн -->
  <text x="58" y="44" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="8.6" font-weight="600" letter-spacing="2.6" fill="#9AA0A6">ПРОМЫШЛЕННАЯ МЕТАЛЛООБРАБОТКА</text>
</svg>
